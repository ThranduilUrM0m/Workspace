packages:
    - 'projects/*/client'
    - 'projects/*/server'
    - 'packages/*'
# One TypeScript for every project: packages write "typescript": "catalog:"
# and this line is the only place its version lives.
catalog:
    typescript: 5.9.3

# Force a single jest-mock/jest-environment-node version across the graph.
# react-native (pulled in via @react-spring/native) pins jest-environment-node
# ^29.7.0 as an optional peer for its own jest preset, so without this pnpm
# installs both 29.7.0 and 30.4.1 side by side and Jest's test-environment
# resolver picks up the stale 29.x copy, breaking every test suite with
# "clearMocksOnScope is not a function" (jest-runtime@30 requires jest-mock
# 30's ModuleMocker API). Boutaleb's client doesn't use react-native's own
# tests, only its runtime code, so pinning to the jest devDependency's
# version is safe.
overrides:
    jest-mock: '30.5.2'
    jest-environment-node: '30.5.2'
    # Security floors (pnpm audit, 2026-10-24). Each targets only the
    # vulnerable range and stays inside its major. All sit under next
    # (sass, styled-jsx).
    # Drop a line once its parent ships the fix on its own.
    'picomatch@>=4.0.0 <4.0.4': '^4.0.4'
    'immutable@>=5.0.0 <5.1.8': '^5.1.8'
    'browserslist@<4.28.7': '^4.28.7'
    'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
    '@babel/core@>=7.0.0 <7.29.6': '^7.29.6'
    'baseline-browser-mapping@>=2.0.0 <2.11.0': '^2.11.0'
    # fast-uri: under @hookform/resolvers > ajv (packages/ui).
    'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'

# Allow React 19 for packages that are compatible at runtime and
# add a package extension to relax the peer deps of @react-spring/zdog
peerDependencyRules:
    # treat react/react-dom v19 as allowed for packages that only declare ^16/17/18
    allowedVersions:
        react: '>=19 <20'
        react-dom: '>=19 <20'
    # optionally allow any version for packages under the @react-spring scope
    allowAny:
        - '@react-spring/*'

packageExtensions:
    '@react-spring/zdog@*':
        peerDependencies:
            react: '>=16.8.0'
            react-dom: '>=16.8.0'
        peerDependenciesMeta:
            react-dom:
                optional: true
