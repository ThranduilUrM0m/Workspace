name: CI

# Boutaleb and the shared packages only. Maxconfort, Qasidaty and Risala are
# out of scope until their own rebuilds; Playwright stays local (it needs Clerk
# keys from Infisical and is too heavy for the value it adds here).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boutaleb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Install (Boutaleb and its workspace dependencies only)
        run: pnpm install --frozen-lockfile --filter "boutaleb-client..." --filter "boutaleb-server..."

      - name: Type check
        run: |
          pnpm --filter boutaleb-client typecheck
          pnpm --filter boutaleb-server typecheck
          for p in packages/*/; do (cd "$p" && pnpm exec tsc --noEmit -p .); done

      - name: Server tests (Vitest)
        run: pnpm --filter boutaleb-server test

      - name: Client tests (Jest)
        run: pnpm --filter boutaleb-client test

      - name: Security audit (Boutaleb + packages, moderate and up)
        run: node scripts/audit-scope.mjs --level moderate
