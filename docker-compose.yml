version: '3.8'
services:
    risala-client:
        build: ./projects/Risala/client
        ports:
            - '3001:3000'
        env_file: ./projects/Risala/client/.env
        depends_on:
            - risala-server

    risala-server:
        build: ./projects/Risala/server
        ports:
            - '4001:4000'
        env_file: ./projects/Risala/server/.env

    boutaleb-client:
        build: ./projects/Boutaleb/client
        ports:
            - '3002:3002'
        env_file: ./projects/Boutaleb/client/.env
        depends_on:
            - boutaleb-server

    boutaleb-server:
        build:
            context: .
            dockerfile: projects/Boutaleb/server/Dockerfile
        ports:
            - '4002:4002'
        env_file: ./projects/Boutaleb/server/.env
        depends_on:
            - boutaleb-mongo

    # Local dev only: `docker compose up -d boutaleb-mongo`. Production Mongo is
    # Coolify's (ADR-007). The server's default MONGODB_URI points here.
    boutaleb-mongo:
        image: mongo:8.3.17
        ports:
            - '127.0.0.1:27017:27017'
        volumes:
            - boutaleb-mongo-data:/data/db

    maxconfort-client:
        build: ./projects/Maxconfort/client
        ports:
            - '3003:3000'
        env_file: ./projects/Maxconfort/client/.env
        depends_on:
            - maxconfort-server

    maxconfort-server:
        build: ./projects/Maxconfort/server
        ports:
            - '4003:4000'
        env_file: ./projects/Maxconfort/server/.env

    qasidaty-client:
        build: ./projects/Qasidaty/client
        ports:
            - '3004:3000'
        env_file: ./projects/Qasidaty/client/.env
        depends_on:
            - qasidaty-server

    qasidaty-server:
        build: ./projects/Qasidaty/server
        ports:
            - '4004:4000'
        env_file: ./projects/Qasidaty/server/.env

volumes:
    boutaleb-mongo-data:
